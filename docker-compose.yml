services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: credit_analyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    # Uses DATABASE_URL from .env (Neon). Local `db` service is optional.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    # Omit DATABASE_URL here to use Neon from .env; or keep local DB override below.
    # environment:
    #   DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/credit_analyst

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  pgdata:
